name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff
        run: pipx run ruff check analysis

      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for d in infra/bootstrap infra/benchmark; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done

      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        run: |
          for d in infra/bootstrap infra/benchmark; do
            tflint --chdir="$d"
          done

  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: results match the committed numbers
        run: make check PYTHON=python
